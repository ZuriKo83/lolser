<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOL AIR Discord</title>
</head>
<body style="
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #020617;
">

<div style="
  width: 380px;
  padding: 30px 26px;
  border-radius: 30px;
  background:
    radial-gradient(circle at 18% 0%, rgba(56,189,248,0.38) 0%, transparent 36%),
    radial-gradient(circle at 85% 18%, rgba(14,165,233,0.24) 0%, transparent 34%),
    linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
    linear-gradient(145deg, #061826 0%, #082f49 48%, #020617 100%);
  border: 1px solid rgba(186,230,253,0.22);
  box-shadow: 0 28px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
">
  <div style="
    display: inline-block;
    padding: 7px 12px;
    margin-bottom: 20px;
    border-radius: 999px;
    background: rgba(14,165,233,0.14);
    border: 1px solid rgba(125,211,252,0.28);
    color: #bae6fd;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.4px;
  ">
    DISCORD COMMUNITY
  </div>

  <div style="
    width: 112px;
    height: 112px;
    margin: 0 auto 22px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #7dd3fc, #0284c7);
    box-shadow: 0 18px 44px rgba(56,189,248,0.42), 0 0 28px rgba(125,211,252,0.25);
  ">
    <img
      src="https://raw.githubusercontent.com/ZuriKo83/lolser/main/assets/logo.png"
      alt="LOL AIR 로고"
      style="
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;
        object-fit: cover;
        background: #020617;
      "
    >
  </div>

  <h2 style="margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -1.2px;">
    LOL AIR
  </h2>

  <p style="margin: 12px 0 28px; color: #dbeafe; font-size: 15px; line-height: 1.65;">
    내전 · 이벤트 · 서버 상점<br>
    함께 즐기는 디스코드 커뮤니티
  </p>

  <a href="https://discord.gg/X6yPkB3gRD" target="_blank" rel="noopener noreferrer" style="
    display: block;
    padding: 17px 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, #7dd3fc, #38bdf8 45%, #0284c7);
    color: #ffffff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 900;
    box-shadow: 0 16px 36px rgba(56,189,248,0.42), inset 0 1px 0 rgba(255,255,255,0.35);
  ">
    디스코드 입장하기
  </a>

  <p style="margin: 18px 0 0; color: #93c5fd; font-size: 12px;">
    버튼을 누르면 Discord 초대 링크로 이동합니다.
  </p>
</div>

</body>
</html>
