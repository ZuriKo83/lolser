<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOL AIR 서버 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#f7f7f4;--panel:#fff;--soft:#efefeb;--text:#111;--muted:#666;--border:#ddddd6;--accent:#111;--accentText:#fff;--shadow:0 24px 70px rgba(0,0,0,.1);--viewer:rgba(0,0,0,.88)}
[data-theme=dark]{--bg:#080808;--panel:#111;--soft:#1a1a1a;--text:#f3f3f3;--muted:#a3a3a3;--border:#303030;--accent:#fff;--accentText:#111;--shadow:0 24px 80px rgba(0,0,0,.48);--viewer:rgba(0,0,0,.9)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 36%),var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.topbar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px)}.topbar-inner,.page{width:min(1180px,calc(100% - 36px));margin:0 auto}.topbar-inner{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border:1px solid var(--border);border-radius:50%;overflow:hidden;background:var(--panel)}.brand-mark img{width:100%;height:100%;object-fit:cover}.brand strong{font-size:17px}.theme-toggle{border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--text);padding:10px 14px;font-weight:900;cursor:pointer}.hero{padding:54px 0 28px}.eyebrow{display:inline-flex;margin-bottom:18px;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--muted);font-size:13px;font-weight:900}.hero h1{margin:0;max-width:760px;font-size:clamp(44px,7vw,88px);line-height:.95;letter-spacing:-.07em;font-weight:950}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start;padding:18px 0 72px}.sidebar{position:sticky;top:96px;border:1px solid var(--border);border-radius:30px;background:var(--panel);box-shadow:var(--shadow);padding:14px}.sidebar-title{margin:8px 10px 14px;color:var(--muted);font-size:12px;font-weight:950;letter-spacing:.12em}.tab{width:100%;border:1px solid transparent;border-radius:18px;padding:15px 16px;margin-bottom:8px;background:transparent;color:var(--text);text-align:left;font:inherit;font-weight:900;cursor:pointer}.tab small{display:block;margin-top:5px;color:var(--muted);font-weight:600;line-height:1.45}.tab:hover{background:var(--soft)}.tab.active{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.tab.active small{color:color-mix(in srgb,var(--accentText) 72%,transparent)}.content-card{overflow:hidden;border:1px solid var(--border);border-radius:34px;background:var(--panel);box-shadow:var(--shadow)}.content-top{padding:24px 30px;border-bottom:1px solid var(--border);background:var(--soft)}.content-top strong{font-size:20px}.markdown-body{max-width:none;padding:42px;background:var(--panel);color:var(--text);font-family:inherit}.markdown-body h1,.markdown-body h2{border-bottom:1px solid var(--border);letter-spacing:-.035em}.markdown-body p,.markdown-body li{line-height:1.82;word-break:keep-all}.markdown-body table{display:table;width:100%;border-collapse:separate;border-spacing:0;border-radius:14px;border:1px solid var(--border)!important;overflow:hidden;background:var(--panel)!important;background-color:var(--panel)!important;color:var(--text)!important}.markdown-body thead,.markdown-body tbody,.markdown-body tr{background:var(--panel)!important;background-color:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important}.markdown-body th,.markdown-body td{border-color:var(--border)!important;color:var(--text)!important;background:transparent!important;background-color:transparent!important}.markdown-body th{background:var(--soft)!important;background-color:var(--soft)!important;font-weight:900}.markdown-body tr:nth-child(2n){background:var(--soft)!important;background-color:var(--soft)!important}.markdown-body tr:nth-child(2n) td{background:var(--soft)!important;background-color:var(--soft)!important}.markdown-body tr:nth-child(2n) th{background:var(--soft)!important;background-color:var(--soft)!important}.markdown-body code,.markdown-body pre{background:var(--soft);color:var(--text)}.markdown-body img{display:block;max-width:100%;width:auto;height:auto;margin:24px auto;border:1px solid var(--border);border-radius:20px;cursor:zoom-in;box-shadow:0 18px 50px rgba(0,0,0,.16)}.loading{padding:70px 20px;text-align:center;color:var(--muted);font-weight:900}.image-viewer{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:28px;background:var(--viewer)}.image-viewer.open{display:flex}.image-viewer img{max-width:96vw;max-height:92vh;border-radius:20px;cursor:zoom-out}footer{border-top:1px solid var(--border);color:var(--muted);padding:28px 0 46px;font-size:14px;text-align:center}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static}}@media(max-width:620px){.topbar-inner{height:66px}.hero h1{font-size:48px}.content-top{padding:20px}.markdown-body{padding:26px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark"><img src="assets/logo.png" alt="LOL AIR 로고"></div><strong>LOL AIR</strong></div><button id="themeToggle" class="theme-toggle" type="button">라이트 모드</button></div></header>
<div class="page"><section class="hero"><div class="eyebrow">OFFICIAL SERVER GUIDE</div><h1>LOL AIR 서버 가이드</h1></section><main class="layout"><aside class="sidebar"><p class="sidebar-title">DOCUMENTS</p><div id="tabs"></div></aside><section class="content-card"><div class="content-top"><strong id="doc-title">서버 이용 가이드</strong></div><article id="content" class="markdown-body"><div class="loading">문서를 불러오는 중입니다.</div></article></section></main></div>
<footer>© LOL AIR 서버 가이드</footer><div id="imageViewer" class="image-viewer"><img id="viewerImage" src="" alt="확대 이미지"></div>
<script>
const docs=[
{file:"README.md",title:"서버 이용 가이드",name:"서버 이용 가이드",desc:"처음 이용자를 위한 안내"},
{file:"SERVER_RULES.md",title:"서버 규정 전문",name:"서버 규정",desc:"전체 제재 기준과 운영 규정"},
{file:"SHOP_AND_POINT_GUIDE.md",title:"상점 · 포인트 가이드",name:"상점 · 포인트",desc:"상점과 이벤트 안내"},
{file:"내전규정.md",title:"내전 규정",name:"내전 규정",desc:"게임 진행 규칙"},
{file:"무통보차단리스트.md",title:"무통보 차단 리스트",name:"무통보 차단",desc:"즉시 차단 기준"},
{file:"서버경고.md",title:"서버 경고 기준",name:"서버 경고",desc:"경고 부여 기준"}
];
const root=document.documentElement,content=document.getElementById("content"),title=document.getElementById("doc-title"),tabsWrap=document.getElementById("tabs"),imageViewer=document.getElementById("imageViewer"),viewerImage=document.getElementById("viewerImage"),themeToggle=document.getElementById("themeToggle");
function setTheme(theme){root.dataset.theme=theme;localStorage.setItem("lol-air-theme",theme);themeToggle.textContent=theme==="dark"?"라이트 모드":"다크 모드"}
setTheme(localStorage.getItem("lol-air-theme")||"dark");themeToggle.addEventListener("click",()=>setTheme(root.dataset.theme==="dark"?"light":"dark"));
function renderTabs(){tabsWrap.innerHTML=docs.map((d,i)=>`<button class="tab ${i===0?"active":""}" data-index="${i}">${d.name}<small>${d.desc}</small></button>`).join("");tabsWrap.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{tabsWrap.querySelectorAll(".tab").forEach(item=>item.classList.remove("active"));tab.classList.add("active");const d=docs[Number(tab.dataset.index)];loadDoc(d.file,d.title)}))}
async function loadDoc(file,docTitle){content.innerHTML='<div class="loading">문서를 불러오는 중입니다.</div>';title.textContent=docTitle;try{const response=await fetch(encodeURI(file));if(!response.ok){content.innerHTML='<div class="loading">문서를 불러오지 못했습니다.</div>';return}content.innerHTML=marked.parse(await response.text());content.querySelectorAll("img").forEach(img=>{img.removeAttribute("width");img.removeAttribute("height");img.style.maxWidth="100%";img.style.width="auto";img.style.height="auto";img.style.objectFit="contain";img.addEventListener("click",()=>{viewerImage.src=img.src;imageViewer.classList.add("open")})});window.scrollTo({top:0,behavior:"smooth"})}catch(error){content.innerHTML='<div class="loading">문서를 불러오는 중 오류가 발생했습니다.</div>'}}
imageViewer.addEventListener("click",()=>{imageViewer.classList.remove("open");viewerImage.src=""});document.addEventListener("keydown",event=>{if(event.key==="Escape"){imageViewer.classList.remove("open");viewerImage.src=""}});renderTabs();loadDoc("README.md","서버 이용 가이드");
</script>
</body>
</html>
