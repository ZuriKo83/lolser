<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOL AIR 서버 가이드</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #f7f7f4;
      --panel: #ffffff;
      --panel-soft: #efefeb;
      --text: #111111;
      --muted: #666666;
      --border: #ddddd6;
      --accent: #111111;
      --accent-text: #ffffff;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.10);
      --viewer: rgba(0, 0, 0, 0.88);
    }

    [data-theme="dark"] {
      --bg: #080808;
      --panel: #111111;
      --panel-soft: #1a1a1a;
      --text: #f3f3f3;
      --muted: #a3a3a3;
      --border: #303030;
      --accent: #ffffff;
      --accent-text: #111111;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
      --viewer: rgba(0, 0, 0, 0.9);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 36px));
      height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--panel);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: -0.04em;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
    }

    .brand strong {
      display: block;
      font-size: 17px;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      padding: 10px 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--text);
    }

    .page {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    .hero {
      padding: 54px 0 28px;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      margin-bottom: 18px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .hero h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(44px, 7vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      font-weight: 950;
    }

    .layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      padding: 18px 0 72px;
    }

    .sidebar {
      position: sticky;
      top: 96px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .sidebar-title {
      margin: 8px 10px 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.12em;
    }

    .tab {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 18px;
      padding: 15px 16px;
      margin-bottom: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: 0.16s ease;
    }

    .tab small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.45;
    }

    .tab:hover { background: var(--panel-soft); }

    .tab.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .tab.active small {
      color: color-mix(in srgb, var(--accent-text) 72%, transparent);
    }

    .content-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 34px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .content-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 24px 30px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-soft);
    }

    .content-top strong {
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .markdown-body {
      max-width: none;
      padding: 42px;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
    }

    .markdown-body h1,
    .markdown-body h2 {
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.035em;
    }

    .markdown-body h1:first-child { margin-top: 0; }

    .markdown-body p,
    .markdown-body li {
      line-height: 1.82;
      word-break: keep-all;
    }

    .markdown-body table {
      display: table;
      width: 100%;
      overflow: hidden;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel) !important;
      color: var(--text) !important;
    }

    .markdown-body thead,
    .markdown-body tbody,
    .markdown-body tr {
      background: var(--panel) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .markdown-body tr:nth-child(2n) {
      background: var(--panel-soft) !important;
    }

    .markdown-body th,
    .markdown-body td {
      border-color: var(--border) !important;
      color: var(--text) !important;
      background: transparent !important;
    }

    .markdown-body th {
      background: var(--panel-soft) !important;
      font-weight: 900;
    }

    .markdown-body td {
      background: inherit !important;
    }

    .markdown-body code,
    .markdown-body pre { background: var(--panel-soft); color: var(--text); }

    .markdown-body img {
      display: block;
      max-width: 100%;
      width: auto;
      height: auto;
      margin: 24px auto;
      border: 1px solid var(--border);
      border-radius: 20px;
      object-fit: contain;
      cursor: zoom-in;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16);
    }

    .loading {
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
      font-weight: 900;
    }

    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: var(--viewer);
    }

    .image-viewer.open { display: flex; }

    .image-viewer img {
      max-width: 96vw;
      max-height: 92vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
      cursor: zoom-out;
    }

    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      padding: 28px 0 46px;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .hero { padding-top: 42px; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }

    @media (max-width: 620px) {
      .topbar-inner { height: 66px; }
      .hero h1 { font-size: 48px; }
      .content-top { padding: 20px; }
      .markdown-body { padding: 26px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">LOL<br>AIR</div>
        <strong>LOL AIR</strong>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button">라이트 모드</button>
    </div>
  </header>

  <div class="page">
    <section class="hero">
      <div class="eyebrow">OFFICIAL SERVER GUIDE</div>
      <h1>LOL AIR 서버 가이드</h1>
    </section>

    <main class="layout">
      <aside class="sidebar">
        <p class="sidebar-title">DOCUMENTS</p>

        <button class="tab active" data-file="README.md" data-title="서버 이용 가이드">
          서버 이용 가이드
          <small>기본 사용법과 안내</small>
        </button>

        <button class="tab" data-file="내전규정.md" data-title="내전 규정">
          내전 규정
          <small>게임 진행 규칙</small>
        </button>

        <button class="tab" data-file="무통보차단리스트.md" data-title="무통보 차단 리스트">
          무통보 차단
          <small>즉시 차단 기준</small>
        </button>

        <button class="tab" data-file="서버경고.md" data-title="서버 경고 기준">
          서버 경고
          <small>경고 부여 기준</small>
        </button>
      </aside>

      <section class="content-card">
        <div class="content-top">
          <strong id="doc-title">서버 이용 가이드</strong>
        </div>

        <article id="content" class="markdown-body">
          <div class="loading">문서를 불러오는 중입니다.</div>
        </article>
      </section>
    </main>
  </div>

  <footer>© LOL AIR 서버 가이드</footer>

  <div id="imageViewer" class="image-viewer">
    <img id="viewerImage" src="" alt="확대 이미지">
  </div>

  <script>
    const root = document.documentElement;
    const content = document.getElementById("content");
    const title = document.getElementById("doc-title");
    const tabs = document.querySelectorAll(".tab");
    const imageViewer = document.getElementById("imageViewer");
    const viewerImage = document.getElementById("viewerImage");
    const themeToggle = document.getElementById("themeToggle");

    function setTheme(theme) {
      root.dataset.theme = theme;
      localStorage.setItem("lol-air-theme", theme);
      themeToggle.textContent = theme === "dark" ? "라이트 모드" : "다크 모드";
    }

    const savedTheme = localStorage.getItem("lol-air-theme");
    setTheme(savedTheme || "dark");

    themeToggle.addEventListener("click", () => {
      setTheme(root.dataset.theme === "dark" ? "light" : "dark");
    });

    async function loadDoc(file, docTitle) {
      content.innerHTML = '<div class="loading">문서를 불러오는 중입니다.</div>';
      title.textContent = docTitle;

      try {
        const response = await fetch(encodeURI(file));

        if (!response.ok) {
          content.innerHTML = '<div class="loading">문서를 불러오지 못했습니다.</div>';
          return;
        }

        const markdown = await response.text();
        content.innerHTML = marked.parse(markdown);

        content.querySelectorAll("img").forEach(img => {
          img.removeAttribute("width");
          img.removeAttribute("height");
          img.style.maxWidth = "100%";
          img.style.width = "auto";
          img.style.height = "auto";
          img.style.objectFit = "contain";

          img.addEventListener("click", () => {
            viewerImage.src = img.src;
            imageViewer.classList.add("open");
          });
        });

        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (error) {
        content.innerHTML = '<div class="loading">문서를 불러오는 중 오류가 발생했습니다.</div>';
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(item => item.classList.remove("active"));
        tab.classList.add("active");
        loadDoc(tab.dataset.file, tab.dataset.title);
      });
    });

    imageViewer.addEventListener("click", () => {
      imageViewer.classList.remove("open");
      viewerImage.src = "";
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        imageViewer.classList.remove("open");
        viewerImage.src = "";
      }
    });

    loadDoc("README.md", "서버 이용 가이드");
  </script>
</body>
</html>
