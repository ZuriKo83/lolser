<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내전서버 이용 가이드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { margin:0; background:#0f172a; color:#e5e7eb; font-family:Arial, sans-serif; }
    header { padding:48px 24px; text-align:center; background:linear-gradient(135deg,#1e293b,#312e81); }
    header h1 { margin:0; font-size:42px; }
    header p { color:#cbd5e1; }
    nav { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding:20px; background:#111827; position:sticky; top:0; }
    button { border:0; border-radius:999px; padding:12px 18px; background:#334155; color:white; cursor:pointer; font-weight:700; }
    button:hover, button.active { background:#6366f1; }
    main { max-width:980px; margin:32px auto; padding:0 20px; }
    .markdown-body { padding:36px; border-radius:24px; background:white; color:#111827; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  </style>
</head>
<body>
<header>
  <h1>내전서버 이용 가이드</h1>
  <p>서버 이용 방법, 내전 규정, 차단 기준, 서버 경고 기준 안내</p>
</header>

<nav>
  <button class="active" onclick="loadDoc('README.md', this)">이용 가이드</button>
  <button onclick="loadDoc('내전규정.md', this)">내전 규정</button>
  <button onclick="loadDoc('무통보차단리스트.md', this)">무통보 차단</button>
  <button onclick="loadDoc('서버경고.md', this)">서버 경고</button>
</nav>

<main>
  <article id="content" class="markdown-body"></article>
</main>

<script>
  async function loadDoc(file, btn) {
    document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const res = await fetch(file);
    const text = await res.text();
    document.getElementById("content").innerHTML = marked.parse(text);
  }
  loadDoc("README.md", document.querySelector("button"));
</script>
</body>
</html>
