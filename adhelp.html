<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>나미봇 관리자 도움말 역할별 정리</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-2: #1f2330;
      --text: #e8eaf0;
      --muted: #a7adbb;
      --line: #303647;
      --accent: #8b5cf6;
      --accent-2: #38bdf8;
      --danger: #fb7185;
      --code: #10131a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(139, 92, 246, 0.20), transparent 34rem), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      line-height: 1.65;
    }

    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 28px 18px;
      border-right: 1px solid var(--line);
      background: rgba(15, 17, 23, 0.82);
      backdrop-filter: blur(14px);
    }

    .brand {
      margin-bottom: 22px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(56, 189, 248, 0.08));
    }

    .brand strong {
      display: block;
      font-size: 18px;
      line-height: 1.35;
    }

    .brand span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .toc-title {
      margin: 18px 8px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #toc a {
      display: block;
      padding: 7px 10px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    #toc a:hover {
      background: var(--panel-2);
      color: var(--text);
      text-decoration: none;
    }

    main {
      width: 100%;
      max-width: 1180px;
      padding: 42px 44px 80px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      text-decoration: none;
    }

    .button:hover {
      border-color: var(--accent);
      text-decoration: none;
    }

    #status {
      color: var(--muted);
      font-size: 14px;
    }

    article {
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(23, 26, 35, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }

    h1, h2, h3 {
      line-height: 1.32;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 34px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    h2 {
      margin: 42px 0 14px;
      padding-top: 8px;
      font-size: 25px;
    }

    h3 {
      margin: 28px 0 12px;
      font-size: 19px;
      color: #d8ccff;
    }

    p { margin: 10px 0 14px; color: var(--text); }

    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 32px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 26px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      display: table;
      background: var(--panel);
    }

    th, td {
      padding: 11px 13px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: rgba(139, 92, 246, 0.14);
      color: #f3f0ff;
      font-weight: 700;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: rgba(255, 255, 255, 0.025); }

    code {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--code);
      color: #f8fafc;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }

    pre {
      overflow-x: auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--code);
    }

    pre code {
      padding: 0;
      border: 0;
      background: transparent;
    }

    blockquote {
      margin: 16px 0;
      padding: 12px 16px;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      background: rgba(139, 92, 246, 0.10);
      color: var(--muted);
    }

    ul, ol { padding-left: 24px; }
    li { margin: 7px 0; }

    .error {
      border-color: rgba(251, 113, 133, 0.6);
      color: #fecdd3;
    }

    @media (max-width: 900px) {
      .layout { display: block; }
      aside {
        position: relative;
        height: auto;
        max-height: 320px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      main { padding: 26px 16px 60px; }
      article { padding: 22px; border-radius: 18px; }
      h1 { font-size: 27px; }
      h2 { font-size: 22px; }
      table { display: block; overflow-x: auto; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">
        <strong>나미봇 관리자 도움말</strong>
        <span>역할별 명령어 정리</span>
      </div>
      <div class="toc-title">목차</div>
      <nav id="toc"></nav>
    </aside>

    <main>
      <div class="topbar">
        <div id="status">adhelp.md 불러오는 중</div>
        <div class="actions">
          <a class="button" href="./adhelp.md">원문 MD 열기</a>
          <a class="button" href="./README.md">서버 이용 가이드</a>
        </div>
      </div>
      <article id="content"></article>
    </main>
  </div>

  <script>
    const mdPath = './adhelp.md';
    const content = document.getElementById('content');
    const toc = document.getElementById('toc');
    const status = document.getElementById('status');

    function escapeHtml(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function inline(value) {
      let html = escapeHtml(value);
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      return html;
    }

    function slugify(text) {
      return text
        .trim()
        .toLowerCase()
        .replace(/[`*_~]/g, '')
        .replace(/[^\w가-힣]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function renderTable(lines) {
      const rows = lines.map(line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim()));
      const head = rows[0] || [];
      const body = rows.slice(2);
      let html = '<table><thead><tr>' + head.map(cell => `<th>${inline(cell)}</th>`).join('') + '</tr></thead><tbody>';
      html += body.map(row => '<tr>' + row.map(cell => `<td>${inline(cell)}</td>`).join('') + '</tr>').join('');
      html += '</tbody></table>';
      return html;
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n');
      const html = [];
      const headings = [];
      let i = 0;
      let inCode = false;
      let codeLines = [];
      let listOpen = false;

      function closeList() {
        if (listOpen) {
          html.push('</ul>');
          listOpen = false;
        }
      }

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed.startsWith('```')) {
          if (!inCode) {
            closeList();
            inCode = true;
            codeLines = [];
          } else {
            html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
            inCode = false;
          }
          i++;
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          i++;
          continue;
        }

        if (!trimmed) {
          closeList();
          i++;
          continue;
        }

        if (/^---+$/.test(trimmed)) {
          closeList();
          html.push('<hr>');
          i++;
          continue;
        }

        if (/^\|.+\|$/.test(trimmed) && i + 1 < lines.length && /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(lines[i + 1].trim())) {
          closeList();
          const tableLines = [];
          while (i < lines.length && /^\|.+\|$/.test(lines[i].trim())) {
            tableLines.push(lines[i]);
            i++;
          }
          html.push(renderTable(tableLines));
          continue;
        }

        const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          const text = heading[2].trim();
          const id = slugify(text);
          headings.push({ level, text, id });
          html.push(`<h${level} id="${id}">${inline(text)}</h${level}>`);
          i++;
          continue;
        }

        if (trimmed.startsWith('>')) {
          closeList();
          const quoteLines = [];
          while (i < lines.length && lines[i].trim().startsWith('>')) {
            quoteLines.push(lines[i].trim().replace(/^>\s?/, ''));
            i++;
          }
          html.push('<blockquote>' + quoteLines.map(inline).join('<br>') + '</blockquote>');
          continue;
        }

        const list = trimmed.match(/^[-*]\s+(.+)$/);
        if (list) {
          if (!listOpen) {
            html.push('<ul>');
            listOpen = true;
          }
          html.push('<li>' + inline(list[1]) + '</li>');
          i++;
          continue;
        }

        closeList();
        html.push('<p>' + inline(trimmed) + '</p>');
        i++;
      }

      closeList();
      return { html: html.join('\n'), headings };
    }

    function renderToc(headings) {
      toc.innerHTML = headings
        .filter(item => item.level <= 2)
        .map(item => `<a href="#${item.id}" style="padding-left:${item.level === 1 ? 10 : 22}px">${escapeHtml(item.text)}</a>`)
        .join('');
    }

    fetch(mdPath, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('adhelp.md 파일을 불러오지 못했습니다.');
        return response.text();
      })
      .then(markdown => {
        const rendered = renderMarkdown(markdown);
        content.innerHTML = rendered.html;
        renderToc(rendered.headings);
        status.textContent = '최신 adhelp.md 기준으로 표시 중';
      })
      .catch(error => {
        content.classList.add('error');
        content.innerHTML = '<h1>불러오기 실패</h1><p>' + escapeHtml(error.message) + '</p><p>GitHub Pages 또는 웹 서버 환경에서 열어야 정상적으로 표시됩니다.</p>';
        status.textContent = '불러오기 실패';
      });
  </script>
</body>
</html>
