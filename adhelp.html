<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>나미봇 관리자 도움말</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel2: #202434;
      --text: #e8eaf0;
      --muted: #a7adbb;
      --line: #303647;
      --accent: #8b5cf6;
      --cyan: #38bdf8;
      --code: #10131a;
      --mark: rgba(56, 189, 248, .20);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(139, 92, 246, .22), transparent 32rem), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      line-height: 1.65;
    }
    .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 24px 18px;
      border-right: 1px solid var(--line);
      background: rgba(15, 17, 23, .88);
      backdrop-filter: blur(14px);
    }
    main { width: 100%; max-width: 1220px; padding: 38px 44px 80px; }
    .brand {
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(139, 92, 246, .22), rgba(56, 189, 248, .08));
    }
    .brand strong { display: block; font-size: 19px; line-height: 1.35; }
    .brand span { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }
    .search-box { margin: 18px 0; }
    #searchInput {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }
    #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, .16); }
    .hint { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .toc-title { margin: 20px 8px 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    #toc a {
      display: block;
      padding: 7px 10px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }
    #toc a:hover { background: var(--panel2); color: var(--text); }
    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    #status { color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .button {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      text-decoration: none;
    }
    .button:hover { border-color: var(--accent); }
    article {
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(23, 26, 35, .94);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
    }
    section.doc-section {
      margin: 28px 0;
      padding: 22px;
      border: 1px solid rgba(48, 54, 71, .82);
      border-radius: 20px;
      background: rgba(255,255,255,.018);
    }
    section.doc-section.hidden { display: none; }
    h1, h2, h3 { line-height: 1.32; letter-spacing: -.02em; }
    h1 { margin: 0 0 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); font-size: 34px; }
    h2 { margin: 0 0 14px; font-size: 25px; }
    h3 { margin: 26px 0 12px; font-size: 19px; color: #d8ccff; }
    p { margin: 10px 0 14px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0 24px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
    th, td { padding: 11px 13px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; font-size: 14px; }
    th { background: rgba(139, 92, 246, .16); color: #f3f0ff; font-weight: 700; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    tr.hidden { display: none; }
    tr:hover td { background: rgba(255,255,255,.03); }
    code { padding: 2px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--code); color: #f8fafc; font-family: Consolas, "SFMono-Regular", monospace; font-size: .92em; }
    pre { overflow-x: auto; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--code); }
    pre code { padding: 0; border: 0; background: transparent; }
    blockquote { margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--accent); border-radius: 10px; background: rgba(139, 92, 246, .10); color: var(--muted); }
    ul, ol { padding-left: 24px; }
    li { margin: 7px 0; }
    mark { padding: 1px 4px; border-radius: 6px; background: var(--mark); color: var(--text); }
    .empty {
      display: none;
      padding: 22px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.02);
      color: var(--muted);
    }
    .error { border-color: rgba(251,113,133,.6); color: #fecdd3; }
    @media (max-width: 900px) {
      .layout { display: block; }
      aside { position: relative; height: auto; max-height: 390px; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 24px 14px 60px; }
      article { padding: 20px; border-radius: 18px; }
      section.doc-section { padding: 16px; }
      h1 { font-size: 27px; }
      h2 { font-size: 22px; }
      table { display: block; overflow-x: auto; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">
        <strong>나미봇 관리자 도움말</strong>
        <span>역할별 명령어 정리</span>
      </div>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="명령어, 역할, 설명 검색" autocomplete="off" />
        <div class="hint">예: 포인트, 내전, 경고, /밴</div>
      </div>
      <div class="toc-title">목차</div>
      <nav id="toc"></nav>
    </aside>
    <main>
      <div class="topbar">
        <div id="status">adhelp.md 불러오는 중</div>
        <div class="actions">
          <a class="button" href="./adhelp.md">원문 MD 열기</a>
          <a class="button" href="./README.md">서버 이용 가이드</a>
        </div>
      </div>
      <article id="content"></article>
      <div id="empty" class="empty">검색 결과가 없습니다. 다른 명령어, 역할명, 설명으로 다시 검색하세요.</div>
    </main>
  </div>

  <script>
    const mdPath = './adhelp.md';
    const content = document.getElementById('content');
    const toc = document.getElementById('toc');
    const status = document.getElementById('status');
    const searchInput = document.getElementById('searchInput');
    const empty = document.getElementById('empty');
    let rawMarkdown = '';

    function escapeHtml(value) {
      return value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function inline(value) {
      let html = escapeHtml(value);
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      return html;
    }

    function slugify(text) {
      return text.trim().toLowerCase().replace(/[`*_~]/g, '').replace(/[^\w가-힣]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function renderTable(lines) {
      const rows = lines.map(line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim()));
      const head = rows[0] || [];
      const body = rows.slice(2);
      let html = '<table><thead><tr>' + head.map(cell => `<th>${inline(cell)}</th>`).join('') + '</tr></thead><tbody>';
      html += body.map(row => '<tr data-search="' + escapeHtml(row.join(' ').toLowerCase()) + '">' + row.map(cell => `<td>${inline(cell)}</td>`).join('') + '</tr>').join('');
      html += '</tbody></table>';
      return html;
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n');
      const chunks = [];
      const headings = [];
      let current = [];
      let currentTitle = '';
      let currentLevel = 0;
      let currentId = '';

      function pushSection() {
        if (!current.length) return;
        chunks.push({ title: currentTitle, level: currentLevel, id: currentId, lines: current });
        current = [];
      }

      for (const line of lines) {
        const h2 = line.trim().match(/^##\s+(.+)$/);
        if (h2) {
          pushSection();
          currentTitle = h2[1].trim();
          currentLevel = 2;
          currentId = slugify(currentTitle);
          current.push(line);
          headings.push({ level: 2, text: currentTitle, id: currentId });
        } else {
          current.push(line);
          const h1 = line.trim().match(/^#\s+(.+)$/);
          if (h1) headings.push({ level: 1, text: h1[1].trim(), id: slugify(h1[1]) });
        }
      }
      pushSection();

      return {
        html: chunks.map(section => `<section class="doc-section" id="section-${section.id}" data-search="${escapeHtml(section.lines.join(' ').toLowerCase())}">${renderLines(section.lines)}</section>`).join('\n'),
        headings
      };
    }

    function renderLines(lines) {
      const html = [];
      let i = 0;
      let inCode = false;
      let codeLines = [];
      let listOpen = false;
      const closeList = () => { if (listOpen) { html.push('</ul>'); listOpen = false; } };

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();
        if (trimmed.startsWith('```')) {
          if (!inCode) { closeList(); inCode = true; codeLines = []; }
          else { html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>'); inCode = false; }
          i++; continue;
        }
        if (inCode) { codeLines.push(line); i++; continue; }
        if (!trimmed) { closeList(); i++; continue; }
        if (/^---+$/.test(trimmed)) { closeList(); html.push('<hr>'); i++; continue; }
        if (/^\|.+\|$/.test(trimmed) && i + 1 < lines.length && /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(lines[i + 1].trim())) {
          closeList();
          const tableLines = [];
          while (i < lines.length && /^\|.+\|$/.test(lines[i].trim())) { tableLines.push(lines[i]); i++; }
          html.push(renderTable(tableLines));
          continue;
        }
        const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          const text = heading[2].trim();
          const id = slugify(text);
          html.push(`<h${level} id="${id}">${inline(text)}</h${level}>`);
          i++; continue;
        }
        if (trimmed.startsWith('>')) {
          closeList();
          const quoteLines = [];
          while (i < lines.length && lines[i].trim().startsWith('>')) { quoteLines.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
          html.push('<blockquote>' + quoteLines.map(inline).join('<br>') + '</blockquote>');
          continue;
        }
        const list = trimmed.match(/^[-*]\s+(.+)$/);
        if (list) {
          if (!listOpen) { html.push('<ul>'); listOpen = true; }
          html.push('<li>' + inline(list[1]) + '</li>');
          i++; continue;
        }
        closeList();
        html.push('<p>' + inline(trimmed) + '</p>');
        i++;
      }
      closeList();
      return html.join('\n');
    }

    function renderToc(headings) {
      toc.innerHTML = headings.filter(item => item.level <= 2).map(item => {
        const href = item.level === 1 ? `#${item.id}` : `#section-${item.id}`;
        return `<a href="${href}" data-search="${escapeHtml(item.text.toLowerCase())}" style="padding-left:${item.level === 1 ? 10 : 22}px">${escapeHtml(item.text)}</a>`;
      }).join('');
    }

    function applySearch() {
      const query = searchInput.value.trim().toLowerCase();
      const sections = [...document.querySelectorAll('.doc-section')];
      const rows = [...document.querySelectorAll('tbody tr')];
      const tocLinks = [...toc.querySelectorAll('a')];
      let visibleSections = 0;
      rows.forEach(row => row.classList.remove('hidden'));
      if (!query) {
        sections.forEach(section => section.classList.remove('hidden'));
        tocLinks.forEach(link => link.style.display = 'block');
        status.textContent = '최신 adhelp.md 기준으로 표시 중';
        empty.style.display = 'none';
        return;
      }
      sections.forEach(section => {
        const sectionMatch = section.dataset.search.includes(query);
        let visibleRows = 0;
        section.querySelectorAll('tbody tr').forEach(row => {
          const rowMatch = row.dataset.search.includes(query);
          row.classList.toggle('hidden', !rowMatch && !sectionMatch);
          if (rowMatch || sectionMatch) visibleRows++;
        });
        const visible = sectionMatch || visibleRows > 0;
        section.classList.toggle('hidden', !visible);
        if (visible) visibleSections++;
      });
      tocLinks.forEach(link => {
        const targetId = link.getAttribute('href').replace('#', '');
        const target = document.getElementById(targetId);
        const linkMatch = link.dataset.search.includes(query);
        link.style.display = linkMatch || (target && !target.classList.contains('hidden')) ? 'block' : 'none';
      });
      status.textContent = `검색어: ${query} · 결과 섹션 ${visibleSections}개`;
      empty.style.display = visibleSections ? 'none' : 'block';
    }

    fetch(mdPath, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('adhelp.md 파일을 불러오지 못했습니다.');
        return response.text();
      })
      .then(markdown => {
        rawMarkdown = markdown;
        const rendered = renderMarkdown(markdown);
        content.innerHTML = rendered.html;
        renderToc(rendered.headings);
        status.textContent = '최신 adhelp.md 기준으로 표시 중';
        searchInput.addEventListener('input', applySearch);
      })
      .catch(error => {
        content.classList.add('error');
        content.innerHTML = '<h1>불러오기 실패</h1><p>' + escapeHtml(error.message) + '</p><p>GitHub Pages 또는 웹 서버 환경에서 열어야 정상적으로 표시됩니다.</p>';
        status.textContent = '불러오기 실패';
      });
  </script>
</body>
</html>
